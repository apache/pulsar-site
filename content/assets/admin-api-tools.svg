<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Pulsar admin interfaces</title>
  <desc>The pulsar-admin command line, the Java and Go admin clients, and any HTTP automation, including clients generated from the OpenAPI specification, all call the admin REST API served by the brokers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#224c72"/>
    </marker>
  </defs>
  <rect width="940" height="480" fill="#fff"/>

  <text x="20" y="36" font-size="20" font-weight="bold" fill="#1d262b">Pulsar admin interfaces</text>
  <text x="20" y="58" fill="#4b5860">Every interface is a client of the same admin REST API.</text>

  <text x="20" y="102" font-size="13" font-weight="bold" fill="#224c72" letter-spacing="1">INTERFACES</text>

  <g>
    <rect x="20" y="114" width="318" height="70" rx="8" fill="#edf5ff" stroke="#224c72" stroke-width="1.5"/>
    <text x="36" y="141" font-weight="bold" fill="#1d262b">Command line</text>
    <text x="36" y="164" font-size="13" fill="#4b5860">pulsar-admin, Pulsar shell</text>
  </g>
  <g>
    <rect x="20" y="196" width="318" height="70" rx="8" fill="#edf5ff" stroke="#224c72" stroke-width="1.5"/>
    <text x="36" y="223" font-weight="bold" fill="#1d262b">Java admin client</text>
    <text x="36" y="246" font-size="13" fill="#4b5860">org.apache.pulsar:pulsar-client-admin</text>
  </g>
  <g>
    <rect x="20" y="278" width="318" height="70" rx="8" fill="#edf5ff" stroke="#224c72" stroke-width="1.5"/>
    <text x="36" y="305" font-weight="bold" fill="#1d262b">Go admin client</text>
    <text x="36" y="328" font-size="13" fill="#4b5860">pulsar-client-go/pulsaradmin</text>
  </g>
  <g>
    <rect x="20" y="360" width="318" height="92" rx="8" fill="#edf5ff" stroke="#224c72" stroke-width="1.5"/>
    <text x="36" y="387" font-weight="bold" fill="#1d262b">Your own automation</text>
    <text x="36" y="410" font-size="13" fill="#4b5860">curl and scripts, operators and controllers,</text>
    <text x="36" y="430" font-size="13" fill="#4b5860">clients generated from the OpenAPI specification</text>
  </g>

  <g stroke="#224c72" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M338 149 C390 149 390 283 434 283"/>
    <path d="M338 231 C390 231 390 283 434 283"/>
    <path d="M338 313 C390 313 390 283 434 283"/>
    <path d="M338 406 C390 406 390 283 434 283"/>
  </g>

  <g>
    <rect x="436" y="196" width="230" height="174" rx="8" fill="#224c72"/>
    <text x="551" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Admin REST API</text>
    <text x="551" y="254" text-anchor="middle" font-size="13" fill="#cfe4ff">HTTP + JSON</text>
    <text x="551" y="286" text-anchor="middle" font-size="13" fill="#fff">/admin/v2  ·  /lookup/v2</text>
    <text x="551" y="306" text-anchor="middle" font-size="13" fill="#fff">/admin/v3 functions, sources, sinks,</text>
    <text x="551" y="324" text-anchor="middle" font-size="13" fill="#fff">packages, transactions</text>
    <text x="551" y="352" text-anchor="middle" font-size="13" fill="#58d6d7">OpenAPI 3 specification per release</text>
  </g>

  <path d="M666 283 L734 283" stroke="#224c72" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="736" y="196" width="184" height="174" rx="8" fill="#f5fbff" stroke="#4881b3" stroke-width="1.5"/>
    <text x="828" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d262b">Brokers</text>
    <text x="828" y="254" text-anchor="middle" font-size="13" fill="#4b5860">web service port</text>
    <text x="828" y="272" text-anchor="middle" font-size="13" fill="#4b5860">8080 / 8443 (TLS)</text>
    <line x1="752" y1="290" x2="904" y2="290" stroke="#cfe4ff"/>
    <text x="828" y="314" text-anchor="middle" font-size="13" fill="#4b5860">optionally behind the</text>
    <text x="828" y="332" text-anchor="middle" font-size="13" fill="#4b5860">Pulsar proxy; functions</text>
    <text x="828" y="350" text-anchor="middle" font-size="13" fill="#4b5860">served by the function worker</text>
  </g>
</svg>
