# Build the site for the current ("next") documentation version and crawl the
# /docs/** routes of the build output for internal links that do not resolve.
# External links are skipped: the check only depends on this repository.
name: CI - Check docs links
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'client-libraries/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.ts'
      - 'sidebars.json'
      - 'sidebars.js'
      - 'sidebarsClientLibraries.js'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/check-docs-links.mjs'
      - '.github/workflows/ci-link-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  docs-links:
    name: Check documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build current documentation
        run: yarn build
      - name: Check documentation links
        run: yarn check-links
