# Minor and patch updates only for the npm (Yarn) dependencies of the site, grouped into a
# single pull request: major upgrades, such as a new Docusaurus or React major version, are
# made deliberately. Security updates are not affected by these settings.
#
# The commit message prefixes end with a space, so that Dependabot does not add a colon
# after them and the pull request titles match the [type][scope] semantic title format.
#
# An update of a third-party action (for example gradle/actions) can only run after its
# commit is in https://github.com/apache/infrastructure-actions/blob/main/approved_patterns.yml

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "[improve][build] "
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # The composite actions in .github/actions also reference actions
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[improve][ci] "
